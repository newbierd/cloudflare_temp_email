name: Deploy Backend

on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [completed]
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10
          run_install: false

      - name: Deploy Backend for ${{ github.ref_name }}
        run: |
          export use_worker_assets=${{ secrets.USE_WORKER_ASSETS }}
          export use_worker_assets_with_telegram=${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}
          
          if [ -n "$use_worker_assets" ]; then
            cd frontend/
            pnpm install --no-frozen-lockfile
            if [ -n "$use_worker_assets_with_telegram" ]; then
              echo "Building with telegram pages"
              pnpm build:telegram:pages
            else
              echo "Building with normal pages"
              pnpm build:pages
            fi
            cd ..
          fi

          export debug_mode=${{ secrets.DEBUG_MODE }}
          export use_mail_wasm_parser=${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}
          
          cd worker/
          # ✅ 修复核心：使用环境变量写入，避免 Shell 解析特殊字符
          printf '%s\n' "$WRANGLER_TOML_CONTENT" > wrangler.toml

          # Managed by Hermes migration 2026-07-24: keep one-click deploys aligned
          # with the Cloudflare Email Routing split. This intentionally overrides
          # stale BACKEND_TOML domain values without exposing any secret values.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('wrangler.toml')
          text = path.read_text()

          def replace_array_assignment(src, key, values):
              replacement = key + ' = [' + ', '.join(repr(v).replace("'", '"') for v in values) + ']'
              lines = src.splitlines()
              out = []
              replaced = False
              for line in lines:
                  stripped = line.strip()
                  if stripped.startswith(key + ' ') or stripped.startswith(key + '='):
                      out.append(replacement)
                      replaced = True
                  else:
                      out.append(line)
              if not replaced:
                  # Insert near the top of [vars] if present, otherwise append.
                  for i, line in enumerate(out):
                      if line.strip() == '[vars]':
                          out.insert(i + 1, replacement)
                          break
                  else:
                      out.extend(['', '[vars]', replacement])
              return '\n'.join(out) + '\n'

          text = replace_array_assignment(text, 'DOMAINS', [
              'nbvps.de', 'newbie98.de', 'newbiee.de', 'niubie.de',
              'nmdd.de', 'nmzl.de', 'newbie.edu.kg',
          ])
          text = replace_array_assignment(text, 'DEFAULT_DOMAINS', [
              'nmdd.de', 'niubie.de', 'newbiee.de',
          ])
          path.write_text(text)
          PY
          
          pnpm install --no-frozen-lockfile

          if [ -n "$use_mail_wasm_parser" ]; then
            echo "Using mail-parser-wasm-worker"
            pnpm add mail-parser-wasm-worker
            git apply ../.github/config/mail-parser-wasm-worker.patch
            echo "Applied mail-parser-wasm-worker patch"
          fi

          if [ "$debug_mode" = "true" ]; then
            pnpm run deploy
          else
            if pnpm run deploy >/dev/null 2>&1; then
              echo "Deploy succeeded"
            else
              code=$?
              echo "Command failed with exit code $code"
              exit "$code"
            fi
          fi
          echo "Deployed for tag ${{ github.ref_name }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # ✅ 将 secret 映射到环境变量中
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}
